name: Offline checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    # Skip external fork PRs before a private runner can be selected.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64, minipc, ephemeral, autoloot, "rhada-run-${{ github.run_id }}-${{ github.run_attempt }}"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Native runtime and timing
        run: python tools/autoloot_runtime.py --dummy
