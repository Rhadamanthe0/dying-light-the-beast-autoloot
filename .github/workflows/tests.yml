name: Controles hors jeu
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Dependances
        run: python -m pip install -r requirements.txt
      - name: Portabilite et contenu du depot
        run: python -m unittest discover -s tests -v
      - name: Runtime natif et cadence
        run: python tools/autoloot_runtime.py --dummy
